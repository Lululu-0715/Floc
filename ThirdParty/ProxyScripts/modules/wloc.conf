; Floc WLOC — Quantumult X 重写资源
;
; ─────────────────────────────────────────────────────────────
;  导入方式：Quantumult X → 设置 → 重写 → 引用 → 添加订阅，粘贴下面这行
;    https://raw.githubusercontent.com/Lululu-0715/Floc/main/ThirdParty/ProxyScripts/modules/wloc.conf
;
;  ⚠️ 本文件是「远程重写资源」格式，和 .conf 主配置**不是**一回事：
;     不能出现 [rewrite_local] / [mitm] 这类段名，否则 Quantumult X 会
;     直接提示「配置失败」，规则一条都不会生效。
;     远程重写资源就是一份裸列表——可选的 hostname 行 + 若干条重写规则，
;     注释统一用分号开头。
;
;  导入后还要在「设置 → MITM」里打开 MITM 开关；主机名已由下面的
;  hostname 行声明，导入时会并入 MITM 名单，建议顺手核对一眼。
;
;  其他客户端请改用对应文件（功能完全一致，只是格式不同）：
;    Shadowrocket    → wloc.module
;    Surge / Egern   → wloc.sgmodule
;    Loon            → wloc.lpx
;    Stash           → wloc.stoverride
;  对照表见同目录的 README.md
;
;  切勿给下面这些主机名添加 DIRECT 规则——那会让流量绕过代理，
;  规则看起来装好了却永远不会触发。
; ─────────────────────────────────────────────────────────────

hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, gsp10-ssl.ls.apple.com, gsp10-ssl.apple.com, gsp64-ssl.ls.apple.com, gspe1-ssl.ls.apple.com, gspe19-ssl.ls.apple.com, gspe19-2-ssl.ls.apple.com, gspe35-ssl.ls.apple.com, gspe79-ssl.ls.apple.com, gspe85-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com

; 定位响应改写：拦下 Apple 定位服务返回的经纬度并替换成目标坐标。
^https?://(?:gs-loc(?:-cn)?\.apple\.com|gsp(?:-|\d+-|e\d+(?:-\d+)?-)ssl\.(?:ls\.)?apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)/clls/wloc url script-response-body https://raw.githubusercontent.com/Lululu-0715/Floc/main/ThirdParty/ProxyScripts/wloc.js

; 配置接口：应用通过这个请求把目标坐标写进客户端存储。
^https?://gs-loc(-cn)?\.apple\.com/wloc-settings/save url script-echo-response https://raw.githubusercontent.com/Lululu-0715/Floc/main/ThirdParty/ProxyScripts/wloc-settings.js
