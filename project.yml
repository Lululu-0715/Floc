name: Floc
options:
  bundleIdPrefix: com.fff
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

knownRegions:
  - en
  - zh-Hans
  - zh-Hant
  - Base

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.17"
    CURRENT_PROJECT_VERSION: "20"
    # 未签名构建：签名由用户在 Impactor / 爱思助手中完成
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
  configs:
    Debug:
      # @testable import Floc 要求被测模块在 Debug 下开启可测试性。
      # XcodeGen 不会自动补这一项，缺了单元测试会报
      # "module 'Floc' was not compiled for testing"。
      # 只影响 Debug；Release 不开，不会影响出包。
      ENABLE_TESTABILITY: "YES"
      # 界面测试用的注入口（`MapHomeView.applyUITestLaunchArguments`）靠这个
      # 编译条件进门，`#if UI_TEST_HOOKS` 里的代码只进 Debug 构建，
      # 出包产物里根本不存在（Release 不定义）。
      #
      # **为什么不用标准的 `DEBUG`**：本工程的 `#Preview`（ContentView /
      # SpoofGuideOverlay）是包在 `#if DEBUG` 里的，而 `#Preview` 宏要靠
      # `swift-plugin-server` 展开。在受限环境（沙箱 / CI）里插件进程起不来，
      # 一开 `DEBUG` 就会报
      #   external macro implementation type 'PreviewsMacros.SwiftUIView'
      #   could not be found ... swift-plugin-server produced malformed response
      # 于是**每一次 Debug 编译都失败**（出包走 Release，不受影响）。
      # 也就是说：这个工程里 `DEBUG` 一直没定义过，`#Preview` 其实从来没展开过。
      # 用一个只服务于界面测试的条件，既能拿到注入口，又不碰 `#Preview` 那摊。
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: UI_TEST_HOOKS

targets:
  Floc:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fff.loc
        PRODUCT_NAME: Floc
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Floc.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        # 必须显式指定用哪个图标集。XcodeGen 不会像 Xcode 模板那样自动补这一项，
        # 缺了它 actool 不会把 Assets.xcassets 里的 AppIcon 编译成 App 图标——
        # 产物 Info.plist 里既没有 CFBundleIcons 也没有 CFBundleIconName，
        # Assets.car 里只剩 AppIconPreview。装到手机上就是一个白图标，
        # 用户每次自签安装都得自己再补一张图。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/Floc-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -llocationcore"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/Core/build/$(PLATFORM_NAME)"

  FlocTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FlocTests
    settings:
      base:
        # 必须显式指定：不写的话 PRODUCT_NAME 会解析成空串，
        # 测试产物变成 ".xctest"，Xcode 会报
        # "Multiple commands produce .../Floc.app/PlugIns/.xctest"。
        PRODUCT_NAME: FlocTests
        # 宿主 App 模式下的单元测试必须同时给 TEST_HOST 和 BUNDLE_LOADER，
        # 否则测试 bundle 链接不到 App 模块的符号（Undefined symbols: Floc.CoreBridge...）。
        # TEST_HOST 由 XcodeGen 按下方的 target 依赖自动生成，这里只需补 BUNDLE_LOADER。
        BUNDLE_LOADER: "$(TEST_HOST)"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Core"
        SWIFT_OBJC_BRIDGING_HEADER: App/Floc-Bridging-Header.h
    dependencies:
      - target: Floc

  FlocUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FlocUITests
    settings:
      base:
        PRODUCT_NAME: FlocUITests
        # UI 测试要靠这个键知道去启动哪个 App；XcodeGen 不会自动补。
        TEST_TARGET_NAME: Floc
    dependencies:
      - target: Floc

schemes:
  Floc:
    build:
      targets:
        Floc: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FlocTests
        - FlocUITests
    archive:
      config: Release
